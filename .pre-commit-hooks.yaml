- id: reject_legacy_mkpasswd_hashes
  name: Reject legacy, non-yescrypt mkpasswd hashes
  language: system
  # Search files for each literal marker, printing matching filenames and line numbers.
  entry: bash -c 'grep -nHF -e "$1" -e "$2" -e "$3" -e "$4" -e "$5" -e "$6" "${@:7}"; result=$?; test "$result" -eq 1' -- '$1$' '$5$' '$6$' '$2a$' '$2b$' '$7$'
  exclude: ^\.pre-commit-config\.yaml$
